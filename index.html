<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F6F6">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Сервисная книжка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single Android-style phone in the centre, demo notes beside it on wide screens. Palette: black and white neutrals, red/orange/green/indigo for resource states. */
:root{
  --page:#E7E7E7; --bg:#F6F6F6; --surface:#FFFFFF; --surface-2:#EEEEEE; --line:#DEDEDE;
  --fg:#141414; --muted:#6B6B6B; --accent:#141414; --accent-ink:#FFFFFF; --accent-soft:#E2E2E2;
  --warn:#D46A00; --warn-soft:#FBEACF; --ok:#22744A; --ok-soft:#DCEFE3; --unk:#555889; --unk-soft:#E5E6F3;
  --danger:#D11F1F; --frame:#1C1C1C; --frame-edge:#3C3C3C; --paper:#FFFDF5; --paper-ink:#2C2A22; --paper-line:#E3DECC;
  --scrim:rgba(0,0,0,.42); --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#060606; --bg:#111111; --surface:#1B1B1B; --surface-2:#262626; --line:#333333;
  --fg:#EDEDED; --muted:#9B9B9B; --accent:#F2F2F2; --accent-ink:#111111; --accent-soft:#2B2B2B;
  --warn:#FFA347; --warn-soft:#3A2B15; --ok:#7CD39B; --ok-soft:#183223; --unk:#B2B4E6; --unk-soft:#262843;
  --danger:#FF6B63; --frame:#000; --frame-edge:#2C2C2C; --paper:#E8E4D6; --paper-ink:#2C2A22; --paper-line:#CFC9B6;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#060606; --bg:#111111; --surface:#1B1B1B; --surface-2:#262626; --line:#333333;
  --fg:#EDEDED; --muted:#9B9B9B; --accent:#F2F2F2; --accent-ink:#111111; --accent-soft:#2B2B2B;
  --warn:#FFA347; --warn-soft:#3A2B15; --ok:#7CD39B; --ok-soft:#183223; --unk:#B2B4E6; --unk-soft:#262843;
  --danger:#FF6B63; --frame:#000; --frame-edge:#2C2C2C; --paper:#E8E4D6; --paper-ink:#2C2A22; --paper-line:#CFC9B6;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:16px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px}
.side{max-width:440px;display:flex;flex-direction:column;gap:18px}
.side h1{font-size:26px;line-height:1.15;font-weight:700;text-wrap:balance}
.side p{color:var(--muted);font-size:14px}
.side ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.side ol li::marker{color:var(--accent);font-weight:700;font-family:var(--f-mono)}
.side .eyebrow{color:var(--accent)}
.side-list{display:flex;flex-direction:column;gap:8px;font-size:14px}
.side-list li{padding-left:16px;position:relative}
.side-list li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--fg)}
.side .side-fine{font-size:12.5px}
.side-reset{align-self:flex-start}
@media (max-width:980px){.side{display:none}}

.phone{width:392px;max-width:100%;height:min(844px,100%);min-height:560px;background:var(--frame);border-radius:52px;padding:11px;box-shadow:0 0 0 1px var(--frame-edge),0 30px 60px rgba(0,0,0,.25);flex-shrink:0}
.screen-wrap{position:relative;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding-inline:26px 22px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.statusbar .cam{width:12px;height:12px;border-radius:50%;background:var(--frame);position:absolute;left:50%;top:13px;transform:translateX(-50%)}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.statusbar svg{width:16px;height:16px;fill:currentColor}
.main{position:relative;flex:1;min-height:0}
#app,#ov{position:absolute;inset:0}
#ov:empty{pointer-events:none}
.gesture{height:22px;flex-shrink:0;display:grid;place-items:center}
.gesture span{width:118px;height:4px;border-radius:2px;background:var(--fg);opacity:.35}
@media (max-width:520px){
  .stage{padding-block:12px}
  .phone{height:calc(100dvh - 24px);min-height:560px;border-radius:30px;padding:6px}
  .screen-wrap{border-radius:25px}
}

.screen{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.screen.enter{animation:slide .22s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.appbar{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 8px;min-height:56px;flex-shrink:0}
.appbar-t{flex:1;min-width:0;padding-inline:8px}
.appbar-t h1{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-t p{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.footer{flex-shrink:0;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);background:var(--bg)}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card-h{font-size:16px;font-weight:600}

.btn{border:0;border-radius:999px;min-height:44px;padding:10px 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:filter .15s,background .15s}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
.btn.block{width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-tonal{background:var(--accent-soft);color:var(--fg)}
.btn-tonal:hover{filter:brightness(.97)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--accent)}
.btn-outline:hover{background:var(--surface-2)}
.btn-text{background:transparent;color:var(--accent);padding-inline:12px}
.btn-text:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:var(--surface)}

.car h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.car{padding:6px 2px 2px;display:flex;flex-direction:column;gap:2px}

.odo{display:flex;align-items:center;gap:4px}
.odo-d{font-family:var(--f-mono);font-weight:700;font-size:30px;width:30px;height:46px;display:grid;place-items:center;border-radius:7px;background:var(--fg);color:var(--bg);position:relative;overflow:hidden}
.odo-d::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 45%,rgba(0,0,0,.18))}
.odo-d.gap{margin-left:6px}
.odo-u{font-family:var(--f-mono);font-weight:500;font-size:16px;margin-left:8px;color:var(--muted)}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.mini{display:flex;flex-direction:column}
.mini li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.mini li:first-child{border-top:0;padding-top:0}
.mini b{font-weight:600}
.mini-more{color:var(--muted)}
.mini-more > span:nth-child(2){flex:1}
.mini-more .arr{font-weight:600}
.mini-more:hover{color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px;background:var(--muted)}
.dot.over{background:var(--danger)}.dot.soon{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.unknown{background:var(--unk)}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:12px 10px 11px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;flex:1}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:16px;padding:12px 14px;margin-top:10px}
.strip-v{font-family:var(--f-mono);font-weight:700;font-size:20px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:6px}
.sec-h .dot{margin-top:0}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}

.part{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent}
.part:hover{border-color:var(--line)}
.part h4{font-size:16px;font-weight:600}
.part-main{font-weight:600;font-variant-numeric:tabular-nums}
.part.over .part-main{color:var(--danger)}
.part.over{border-color:var(--danger)}
.part.soon .part-main{color:var(--warn)}
.part.ok .part-main{color:var(--ok)}
.part.unknown .part-main{color:var(--unk)}
.part-sub{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.part .btn{align-self:flex-start;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:8px;padding:3px 8px;align-self:flex-start}
.chip svg{width:14px;height:14px}
.chip.wo{background:var(--accent-soft);color:var(--fg)}
.chip.owner{border:1px solid var(--line);color:var(--muted)}
.chip.link{background:var(--ok-soft);color:var(--ok)}
.more{align-self:center}

.timeline{display:flex;flex-direction:column;position:relative;padding-left:22px;margin-top:8px}
.timeline::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:2px;background:var(--line)}
.rec{position:relative;background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px;border:1.5px solid transparent}
.rec:hover{border-color:var(--line)}
.rec::before{content:"";position:absolute;left:-22px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.rec.owner::before{background:var(--bg);border:2px solid var(--muted);width:6px;height:6px}
.rec-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec h4{font-size:16px;font-weight:600}
.rec-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.rec .btn{align-self:flex-start}
.choose{justify-content:center;gap:18px;padding-bottom:72px}
.choose-h{font-size:24px;font-weight:700}
.choose-h span{color:var(--muted);font-variant-numeric:tabular-nums}
.drop{border:0;background:var(--surface-2);border-radius:22px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-size:15px;transition:filter .15s}
.drop:hover{filter:brightness(.97)}
.drop svg{width:34px;height:34px}
.manual-link{align-self:center;font-size:17px;color:var(--fg)}
.manual-link svg{width:22px;height:22px}
.ci{border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.checks .ci > label{border-top:0}
.ci.on > label{font-weight:600}
.item-panel{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:14px;padding:12px;margin:0 0 12px}
.item-panel .input{min-height:44px;background:var(--surface)}
.item-panel .input input{padding:9px 0;font-size:15px}
.item-row{display:flex;gap:10px;align-items:flex-end}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);min-height:44px}
.stepper button{border:0;background:transparent;width:38px;height:42px;font-size:20px;border-radius:12px}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.line-sum{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.photo-add{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-size:14px;background:var(--surface)}
.photo-add:hover{border-color:var(--muted)}
.photo-add svg{width:18px;height:18px;flex-shrink:0}
.photo{display:flex;align-items:center;gap:10px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.receipt-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px dashed var(--muted);padding-top:10px;font-family:var(--f-mono);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.wo-lines li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wo-lines li:first-child{border-top:0;padding-top:0}
.wo-lines img,.wo-lines .ph{width:44px;height:44px;border-radius:10px;flex-shrink:0;object-fit:cover}
.wo-lines .ph{background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.wo-lines .ph svg{width:18px;height:18px}
.wo-lines div{flex:1;min-width:0;display:flex;flex-direction:column}
.wo-lines b{font-weight:600}
.rc-row{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;flex-shrink:0}
.rc-row::-webkit-scrollbar{display:none}
.part.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--fg)}100%{box-shadow:var(--shadow)}}
.compl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:0;background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px;text-align:left;box-shadow:var(--shadow);width:100%}
.compl:hover{filter:brightness(.98)}
.compl-t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.compl-t b{font-weight:600;font-size:15px}
.compl-arr{font-size:22px;line-height:1;color:var(--muted)}
.compl-bar{order:3;flex-basis:100%;display:flex;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.compl-bar i{display:block;height:100%}
.compl-bar .wo{background:var(--fg)}
.compl-bar .own{background:var(--muted);opacity:.55}
.sheet-sec{display:flex;flex-direction:column;gap:4px}
.sheet-sec .sec-h{margin-top:4px}
.dot.owner-dot{background:var(--muted)}
.list-btn .arr{font-size:22px;color:var(--muted);line-height:1}
.pp{gap:8px}
.pp-st{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pp-st .dot{margin-top:0}
.pp-main{font-size:19px;font-weight:700;line-height:1.3}
.pp.over .pp-main{color:var(--danger)}.pp.soon .pp-main{color:var(--warn)}.pp.ok .pp-main{color:var(--ok)}.pp.unknown .pp-main{color:var(--unk)}
.pp.over{box-shadow:0 0 0 1.5px var(--danger)}
.pp .btn{margin-top:4px}
.clk{cursor:pointer}
.found .arr,.wo-lines .arr{color:var(--muted);font-size:20px}
.scroll:has(.pnl){gap:10px;padding-inline:0}
.pnl{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:6px;border-radius:24px}
.pnl.top{gap:12px;margin-top:8px}
.pnl-h{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.pnl-h .dot{margin-top:0;width:10px;height:10px}
.pnl-s{font-size:13px;color:var(--muted);margin-top:-4px}
.pnl .rc-row{margin-top:6px}
.pnl .compl{background:var(--surface-2);box-shadow:none;margin-top:0}
.part.rp{flex:0 0 268px;scroll-snap-align:start;background:var(--surface-2);box-shadow:none;border:1.5px solid transparent}
.part.rp:hover{border-color:var(--line)}
.part.rp.over{border-color:var(--danger)}
.part.rp .btn{margin-top:auto}
.part.rp .chip{margin-bottom:4px}
.part.rp .chip.owner{background:var(--surface)}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.part .btn-row .btn{margin-top:0}
.part.rp .btn-row{margin-top:auto}
.cr{display:flex;align-items:center;gap:8px}
.cr .list-btn{flex:1;min-width:0}
.cr .btn{flex-shrink:0}
.rec.factory::before{background:var(--bg);border:2px dashed var(--muted);width:6px;height:6px}
.scroll > .rule:first-child{margin-top:10px}
.btn-col{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.note svg{width:16px;height:16px;vertical-align:-3px}

.wo-item{display:flex;gap:14px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent}
.wo-item:hover{border-color:var(--line)}
.wo-item > div:last-child{min-width:0;display:flex;flex-direction:column;gap:3px}
.wo-item h4{font-size:16px;font-weight:600}
.thumb{width:58px;height:76px;flex-shrink:0;border-radius:6px;background:var(--paper);border:1px solid var(--paper-line);padding:8px 7px;display:flex;flex-direction:column;gap:5px;transform:rotate(-2deg)}
.thumb i{display:block;height:3px;border-radius:2px;background:var(--paper-line)}
.thumb i:first-child{background:var(--paper-ink);opacity:.6;width:70%}
.thumb i:nth-child(3){width:80%}.thumb i:nth-child(5){width:60%}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 12px}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 16px 18px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;line-height:1.5;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12);transform:rotate(-1deg)}
.paper-h{display:flex;justify-content:space-between;font-weight:700;font-size:12px;border-bottom:1.5px solid var(--paper-ink);padding-bottom:6px;margin-bottom:6px}
.paper table{width:100%;border-collapse:collapse;margin-top:8px}
.paper td{padding:3px 0;border-bottom:1px dashed var(--paper-line)}
.paper td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.paper-total{text-align:right;font-weight:700;font-size:12.5px;margin-top:8px}
.stamp{position:absolute;right:16px;bottom:34px;width:76px;height:76px;border-radius:50%;border:2px solid #3B5BA8;color:#3B5BA8;display:grid;place-items:center;text-align:center;font-size:8.5px;font-weight:700;line-height:1.2;transform:rotate(-14deg);opacity:.55;padding:6px}
.scanline{position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(180deg,transparent,rgba(128,128,128,.3));border-bottom:2px solid var(--accent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{to{top:100%}}

.center-block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.center-block h2{font-size:21px;font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:rot .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}

const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
function addMonths(s,n){const d=pd(s),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return iso(d)}

function compute(r){
  if(!r.km&&!r.mo) return {r,status:'none'};
  const last=lastFor(r.id);
  if(!last) return {r,status:'unknown'};
  const kmLeft=r.km?last.mileage+r.km-S.v.mileage:null;
  const due=r.mo?addMonths(last.date,r.mo):null;
  const daysLeft=due?diffDays(due,TODAY):(kmLeft!=null?Math.round(kmLeft/AVG):null);
  const fr=[];
  if(kmLeft!=null) fr.push(kmLeft/r.km);
  if(due) fr.push(daysLeft/Math.max(1,diffDays(due,last.date)));
  const frac=Math.min(...fr);
  const over=frac<0, soon=frac<=0.2;
  const urg=Math.min(kmLeft!=null?kmLeft/AVG:Infinity,daysLeft!=null?daysLeft:Infinity);
  let main,short;
  if(soon){
    const p=[];
    if(kmLeft!=null) p.push(kmLeft>=0?`Через ${km(kmLeft)} км`:`Пробег превышен на ${km(-kmLeft)} км`);
    if(daysLeft!=null){
      if(kmLeft!=null) p.push(daysLeft>=0?`примерно ${days(daysLeft)}`:`срок вышел ${days(-daysLeft)} назад`);

    }
    main=p.join(' · ');
    const byTime=due&&(kmLeft==null||daysLeft/Math.max(1,diffDays(due,last.date))<kmLeft/r.km);
    short=!byTime?(kmLeft>=0?`через ${km(kmLeft)} км`:`пробег превышен на ${km(-kmLeft)} км`):(daysLeft>=0?`через ${days(daysLeft)}`:'срок вышел');
  }else{
    if(r.km&&r.mo){main=`Следующая замена — через ${km(kmLeft)} км, но не позже ${monYearGen(due)}`;short=`через ${km(kmLeft)} км`}

    else {main=`Следующая замена — через ${km(kmLeft)} км`;short=`через ${km(kmLeft)} км`}
  }
  if(over){
    const p=[];
    if(kmLeft!=null&&kmLeft<0) p.push(`Пробег превышен на ${km(-kmLeft)} км`);
    if(due&&daysLeft<0) p.push(`${p.length?'срок':'Срок'} вышел ${days(-daysLeft)} назад`);
    main=p.join(' · ');
    short=kmLeft!=null&&kmLeft<0?`превышен на ${km(-kmLeft)} км`:`срок вышел ${days(-daysLeft)} назад`;
  }
  return {r,status:over?'over':soon?'soon':'ok',frac,last,kmLeft,daysLeft,due,main,short,urg};
}

function partCard(x){
  const r=x.r;
  if(x.status==='unknown') return `<article class="part unknown" data-a="part" data-id="${r.id}" tabindex="0">
    <h4>${r.name}</h4><p class="part-main">Нет информации о замене</p>
    <p class="part-sub">${r.hint||`По регламенту: ${lowFirst(intervalLabel(r))}. Укажите последнюю замену, чтобы увидеть остаток.`}</p>
    <div class="btn-row"><button class="btn btn-tonal sm" data-a="part" data-id="${r.id}">Указать замену</button>${canNew(r)?`<button class="btn btn-outline sm" data-a="factory" data-id="${r.id}">Ещё не менял</button>`:''}</div></article>`;
  return `<article class="part ${x.status}" data-a="part" data-id="${r.id}" tabindex="0">
    <h4>${r.name}</h4><p class="part-main">${x.main}</p>
    <p class="part-sub">${intervalLabel(r)}${r.custom?' · ваш период':''}</p>
    <p class="part-sub">${x.last.source==='factory'?`Оригинальная деталь, автомобиль ${pd(S.v.made).getUTCFullYear()} года`:`Последняя замена: ${fmtDateLow(x.last.date)} · ${km(x.last.mileage)} км`}</p>
    ${srcChip(x.last)}
    ${x.status==='soon'||x.status==='over'?`<button class="btn btn-primary sm" data-a="part" data-id="${r.id}">Отметить замену</button>`:''}
  </article>`;
}

function attnCard(x){
  const r=x.r; let main,sub='';
  if(x.status==='over'){
    if(x.kmLeft!=null&&x.kmLeft<0){main=km(S.v.mileage-x.last.mileage);sub=`из ${km(r.km)} по регламенту`}
    else{main=`${Math.round(diffDays(TODAY,x.last.date)/30.44)} мес.`;sub=`из ${r.mo} мес. по регламенту`}
  }else{
    const kmT=x.kmLeft!=null?`${km(x.kmLeft)} км`:null;
    const dT=r.mo&&x.daysLeft!=null?days(x.daysLeft):null;
    const byKm=kmT&&(!dT||x.kmLeft/AVG<=x.daysLeft);
    main=`через ${byKm?kmT:dT}`; const other=byKm?dT:kmT; if(other) sub=`или ${other}`;
  }
  return `<button class="attn ${x.status}" data-a="partpage" data-id="${r.id}">
    <span class="attn-h">${pIcon(r.id)}<span>${r.name}</span></span>
    <span class="attn-v"><b>${main}</b>${sub?`<span>${sub}</span>`:''}</span></button>`;
}
function unkCard(x){
  const r=x.r;
  return `<article class="attn unk" data-a="partpage" data-id="${r.id}" tabindex="0">
    <span class="attn-h">${pIcon(r.id)}<span class="nm">${r.name}</span><span class="iv">${intervalLabel(r)}</span></span>
    <p class="unk-q">Как долго не меняли?</p>
    <button class="btn-date" data-a="manual" data-part="${r.id}">Указать дату</button></article>`;
}
function okCard(x){
  const r=x.r, l=x.last;
  const src=l.source==='factory'?`С завода ${pd(l.date).getUTCFullYear()}`:`${l.source==='wo'?'З/н':'Ручное'} ${dots(l.date)}`;
  return `<button class="okc" data-a="partpage" data-id="${r.id}">${pIcon(r.id)}
    <span class="okc-t"><b>${r.name}</b><span>${src}</span></span></button>`;
}
function newItem(id){return {name:R(id).name,qty:1,price:null,photo:null}}
const lineSum=it=>(it.price||0)*(it.qty||1);
const itemsTotal=d=>d.parts.reduce((s,id)=>s+(d.items[id]?lineSum(d.items[id]):0),0);
function itemPanel(id,it){
  return `<div class="item-panel">
    <div class="field"><label for="in-${id}">Название в заказ-наряде</label><div class="input"><input id="in-${id}" data-item="${id}" data-f="name" value="${esc(it.name)}" placeholder="${esc(R(id).name)}"></div></div>
    <div class="item-row">
      <div class="field"><label>Кол-во</label><div class="stepper"><button data-a="qty" data-id="${id}" data-d="-1" aria-label="Меньше">−</button><span id="iq-${id}">${it.qty}</span><button data-a="qty" data-id="${id}" data-d="1" aria-label="Больше">+</button></div></div>
      <div class="field" style="flex:1;min-width:0"><label for="ip-${id}">Цена за шт.</label><div class="input"><input id="ip-${id}" data-item="${id}" data-f="price" inputmode="numeric" data-fmt value="${it.price?km(it.price):''}" placeholder="0"><span>₽</span></div></div>
    </div>
    <p class="line-sum" id="ls-${id}" ${it.qty>1&&it.price?'':'hidden'}>${it.qty} × ${km(it.price||0)} = ${money(lineSum(it))}</p>
    ${it.photo?`<div class="photo"><img src="${it.photo}" alt="Фото: ${esc(it.name)}"><button class="btn btn-text sm" data-a="photo-del" data-id="${id}">Удалить фото</button></div>`
      :`<label class="photo-add">${I.camera}<span>Фото детали <span class="muted">· по желанию</span></span><input type="file" accept="image/*" data-photo="${id}" hidden></label>`}
  </div>`;
}
function syncTotals(id){
  const d=ui.draft; if(!d||!d.manual) return;
  const t=document.getElementById('e-total'); if(t) t.textContent=km(itemsTotal(d))+'\u00a0₽';
  const it=d.items[id]; if(!it) return;
  const q=document.getElementById('iq-'+id); if(q) q.textContent=it.qty;
  const l=document.getElementById('ls-'+id);
  if(l){l.hidden=!(it.qty>1&&it.price);l.textContent=`${it.qty} × ${km(it.price||0)} = ${money(lineSum(it))}`}
}

const SCREENS={
  home(){
    const res=resource();
    const need=[...res.over,...res.soon];
    const OTHER={2021:9800,2022:3200,2023:14500,2024:4100,2025:8700,2026:2400};
    const y0=pd(S.v.made).getUTCFullYear(), y1=pd(TODAY).getUTCFullYear(), yrs=[];
    for(let y=y0;y<=y1;y++) yrs.push({y,wo:S.wos.filter(w=>pd(w.date).getUTCFullYear()===y).reduce((a,w)=>a+(w.price||0),0),ot:OTHER[y]||0});
    const spent=yrs.reduce((a,x)=>a+x.wo+x.ot,0);
    const mx=Math.max(1,...yrs.map(x=>x.wo+x.ot)), BH=32;
    const seg=(v,c)=>v?`<i class="${c}" style="height:${Math.max(4,Math.round(v/mx*BH))}px"></i>`:'';
    const docs=[...S.wos].sort((a,b)=>b.date.localeCompare(a.date));
    const svc=(l,ic)=>`<button class="g-svc" data-a="noop"><span class="g-svc-ic">${ic}</span><span>${l}</span></button>`;
    return `<div class="screen garage">
      <header class="g-bar"><button class="icon-btn" data-a="noop" aria-label="Назад">${I.back}</button><h1>Гараж</h1>
        <div class="g-bar-r"><button class="icon-btn" data-a="noop" aria-label="Мои машины">${I.cars}</button><button class="icon-btn" data-a="menu" aria-label="Меню">${I.more}</button></div></header>
      <div class="scroll g-scroll">
        <section class="g-hero"><img src="data:image/jpeg;base64,${HERO}" alt="">
          <div class="g-hero-t"><h2>${S.v.name}</h2><span class="g-plate">${S.v.plate||'А 999 АА 99'}</span></div>
          <div class="g-hero-b"><button class="g-hb" data-a="noop" aria-label="Настройки">${I.gear}</button><button class="g-hb" data-a="noop" aria-label="Добавить фото">${I.camera}</button></div></section>
        <div class="g-dots"><i class="on"></i><i></i><i></i></div>
        <section class="g-card">
          <button class="g-h" data-a="open-tab" data-tab="book"><h2>История обслуживания</h2>${I.chev}</button>
          <div class="g-two">
            <button class="g-tile" data-a="open-tab" data-tab="book">
              ${need.length?`<span class="g-warn">${I.warn}</span><b>${res.over.length?'Требуется обслуживание':'Скоро обслуживание'}</b>
              <span class="g-icons">${need.slice(0,3).map(x=>pIcon(x.r.id)).join('')}${need.length>3?`<em>+${need.length-3}</em>`:''}</span>`
              :`<span class="g-ok">${I.okcircle}</span><b>Ближайших замен нет</b>`}
            </button>
            <button class="g-tile g-spend" data-a="open-tab" data-tab="wos">
              <span class="muted small">Траты за всё время</span><b class="g-sum">${money(spent)}</b>
              <span class="g-bars">${yrs.map(x=>`<span class="g-bar-c"><span class="g-stack">${seg(x.ot,"ot")}${seg(x.wo,"wo")}</span><span class="g-yr">${x.y}</span></span>`).join('')}</span>
            </button>
          </div>
          <h3 class="g-sub">Загруженные документы</h3>
          <div class="g-docs">
            <button class="g-doc g-add" data-a="wo-choose" aria-label="Добавить заказ-наряд">${I.plus}</button>
            ${docs.map(w=>`<button class="g-doc" data-a="wo" data-id="${w.id}"><span class="g-tag">ТО №${w.number}</span><b>${fmtDateFull(w.date)}</b><span class="muted small">${km(w.mileage)} км</span></button>`).join('')}
          </div>
        </section>
        <section class="g-card g-svc-card">
          <h2 class="g-title">Сервисы</h2>
          <div class="g-svcs">
            <button class="g-svc wide" data-a="noop"><img src="data:image/png;base64,${SVC.tire}" alt=""><span>Шины</span></button>
            <button class="g-svc" data-a="noop"><img src="data:image/png;base64,${SVC.wash}" alt=""><span>Мойки</span></button>
            <button class="g-svc" data-a="noop"><img src="data:image/png;base64,${SVC.fuel}" alt=""><span>Заправки</span></button></div>
        </section>
        <section class="g-card">
          <div class="g-h static"><h2>Стоимость автомобиля</h2><span class="g-badge">оценка</span></div>
          <div class="g-kv"><span class="muted small">Средняя цена</span><b>3 150 000 ₽</b></div>
          <button class="g-kv row" data-a="noop"><span><span class="muted small">Самостоятельная продажа · 30–60 дней</span><b>3 250 000–3 400 000 ₽</b></span>${I.chev}</button>
          <button class="g-btn" data-a="noop">Подробная оценка</button>
        </section>
        <section class="g-card">
          <button class="g-h" data-a="noop"><h2><span class="g-q">бж</span>67 вопросов и 256 ответов</h2>${I.chev}</button>
          <p class="small">Более 1000 владельцев ${S.v.name}. Получите совет из личного опыта</p>
          <button class="g-btn" data-a="noop">${I.mega}Задать вопрос сообществу</button>
        </section>
      </div></div>`;
  },
  tabs(){
    const t=nav.tab;
    const plus=t==='book'?`<button class="icon-btn" data-a="book-add" aria-label="Добавить">${I.plus}</button>`
      :t==='wos'?`<button class="icon-btn" data-a="wo-choose" aria-label="Добавить заказ-наряд">${I.plus}</button>`:'';
    const tab=(id,l)=>`<button class="tab" role="tab" aria-selected="${t===id}" data-a="tab" data-tab="${id}">${l}</button>`;
    return `<div class="screen">${appbar(S.v.name,`${km(S.v.mileage)} км`,plus)}
      <div class="tabs" role="tablist">${tab('book','Запчасти')}${tab('wos','Заказ-наряды')}</div>
      <div class="scroll">${TABS[t]()}</div></div>`;
  },
  partpage(st){
    const r=R(st.id), x=compute(r);
    const hist=sortRecs().filter(rec=>rec.parts.includes(r.id));
    const LBL={over:'Пора менять',soon:'Скоро менять',ok:'В порядке',unknown:S.flags[r.id]==='check'?'Давно не меняли':'Нужно уточнить историю',none:'Интервал не указан'};
    const head=x.status==='unknown'||x.status==='none'
      ?`<p class="pp-main">Нет информации о замене</p><p class="muted small">Укажите последнюю замену, чтобы увидеть остаток.</p>${canNew(r)?`<button class="btn btn-outline block" data-a="factory" data-id="${r.id}">Ещё не менял — стоит оригинальная</button>`:''}`
      :`<p class="pp-main">${x.main}</p><p class="muted small">${x.last.source==='factory'?'Оригинальная деталь, не менялась с завода':`Последняя замена: ${fmtDateLow(x.last.date)} · ${km(x.last.mileage)} км`}</p>`;
    return `<div class="screen">${appbar(r.name,'Запчасть')}<div class="scroll">
      <section class="card pp ${x.status}">
        <span class="pp-st"><span class="dot ${x.status}"></span>${LBL[x.status]}</span>
        ${head}
        <button class="btn btn-primary block" data-a="part" data-id="${r.id}">Отметить замену</button>
      </section>
      <section class="card reg"><h2 class="card-h">Регламент</h2>
        <dl class="kv"><div><dt>Интервал</dt><dd>${intervalLabel(r)}</dd></div><div><dt>Источник</dt><dd>${r.custom?'Ваш период':SRC_LABEL[r.src]}</dd></div></dl>
        <div class="reg-acts">${r.excluded
          ?`<button class="btn btn-primary sm" data-a="unexclude" data-id="${r.id}">Вернуть в отслеживание</button>`
          :`<button class="btn btn-tonal sm" data-a="rule" data-id="${r.id}">${r.km||r.mo?'Изменить период':'Указать период'}</button><button class="btn btn-outline sm" data-a="exclude" data-id="${r.id}">Исключить</button>`}</div>
        ${r.excluded?'<p class="muted small">Деталь исключена: её нет в ресурсе и напоминаниях.</p>':'<p class="muted small">Исключите деталь, если её нет на вашей машине или вы следите за ней сами.</p>'}</section>
      <h3 class="sec-h">История замен<span class="count">${hist.length}</span></h3>
      ${hist.length?`<div class="timeline">${hist.map(rec=>{const pr=partPrice(rec,r.id),w=rec.woId&&S.wos.find(q=>q.id===rec.woId);return `<article class="rec ${rec.source}" style="cursor:default">
        <span class="rec-meta">${rec.source==='factory'?`С завода · ${monYear(rec.date)}`:`${fmtDate(rec.date)} · ${km(rec.mileage)} км`}</span>
        ${w&&w.items&&w.items[r.id]?`<h4>${esc(w.items[r.id].name)}${w.items[r.id].qty>1?` · ${w.items[r.id].qty} шт.`:''}</h4>`:''}
        <div class="rec-foot">${srcChip(rec)}${pr?`<span class="price">${money(pr)}</span>`:''}</div>
        ${rec.service?`<span class="muted small">${esc(rec.service)}</span>`:''}
        ${rec.source==='factory'?`<span class="muted small">Отмечено, что деталь ещё не меняли</span>`:w?`<button class="btn btn-outline sm" data-a="wo" data-id="${w.id}">${I.doc}Заказ-наряд №${w.number}</button>`
          :`<button class="btn btn-tonal sm" data-a="wo-choose" data-rec="${rec.id}">${I.docplus}Добавить заказ-наряд</button>`}
      </article>`}).join('')}</div>`
      :`<p class="note">Замен этой детали пока нет в истории.</p>`}
    </div></div>`;
  },
  rules(){
    return `<div class="screen">${appbar('Регламент',S.v.name)}<div class="scroll">${TABS.rules()}</div></div>`;
  },
  resource(){
    return `<div class="screen">${appbar('Ресурс деталей',`${km(S.v.mileage)} км`)}<div class="scroll">${TABS.resource()}</div></div>`;
  },
  record(st){
    const r=S.records.find(x=>x.id===st.id); if(!r) return SCREENS.home();
    const wo=r.woId&&S.wos.find(w=>w.id===r.woId);
    return `<div class="screen">${appbar(esc(r.title),'Запись обслуживания')}<div class="scroll">
      <section class="card">
        <span class="rec-meta">${fmtDate(r.date)} · ${km(r.mileage)} км</span>
        <h2 style="font-size:22px">${esc(r.title)}</h2>${srcChip(r)}
        <ul class="bullets">${r.parts.map(id=>`<li>${R(id).name}</li>`).join('')}</ul>
        ${r.service||r.price?`<dl class="kv">${r.service?`<div><dt>Сервис</dt><dd>${esc(r.service)}</dd></div>`:''}${r.price?`<div><dt>Стоимость</dt><dd>${money(r.price)}</dd></div>`:''}</dl>`:''}
      </section>
      ${wo?`<section class="wo-item" data-a="wo" data-id="${wo.id}">${thumb}<div><span class="eyebrow">Документ</span><h4>Заказ-наряд №${wo.number}</h4><span class="muted small">${esc(wo.service)}${wo.price?' · '+money(wo.price):''}</span><span class="chip link">${I.link}Связано с сервисной книжкой</span></div></section>`
      :`<section class="card"><h2 class="card-h">Документа пока нет</h2>
        <p class="muted small">Запись уже учитывается в ресурсе. Заказ-наряд добавит сервис, стоимость и другие детали из этого обслуживания.</p>
        <button class="btn btn-primary block" data-a="wo-choose" data-rec="${r.id}">${I.docplus}Добавить заказ-наряд</button></section>`}
    </div></div>`;
  },
  wo(st){
    const w=S.wos.find(x=>x.id===st.id); if(!w) return SCREENS.home();
    return `<div class="screen">${appbar(`Заказ-наряд №${w.number}`,esc(w.service))}<div class="scroll">
      ${w.manual?`<p class="note">${I.pen} Заказ-наряд записан вручную, без фото документа.</p>`:`<div style="padding:8px 6px 4px">${paper(w,w.number)}</div>`}
      <section class="card"><dl class="kv">
        <div><dt>Дата</dt><dd>${fmtDate(w.date)}</dd></div><div><dt>Пробег</dt><dd>${km(w.mileage)} км</dd></div>
        <div><dt>Сервис</dt><dd>${esc(w.service)}</dd></div>${w.price?`<div><dt>Сумма</dt><dd>${money(w.price)}</dd></div>`:''}</dl></section>
      <section class="card"><h2 class="card-h">${w.items?'Позиции':'Найденные позиции'}</h2>
        ${w.items?`<ul class="wo-lines">${w.parts.map(id=>{const it=w.items[id];return `<li data-a="partpage" data-id="${id}" class="clk">${it.photo?`<img src="${it.photo}" alt="">`:`<span class="ph">${I.wrench}</span>`}<div><b>${esc(it.name)}</b><span class="muted small">${R(id).name}${it.qty>1?` · ${it.qty} шт. × ${km(it.price||0)} ₽`:''}</span></div><span class="tnum">${it.price?money(lineSum(it)):'—'}</span></li>`}).join('')}</ul>
          ${w.price?`<div class="receipt-total"><span>ИТОГО:</span><span>${money(w.price)}</span></div>`:''}`
        :`<ul class="found">${w.parts.map(id=>`<li data-a="partpage" data-id="${id}" class="clk">${I.check}<span style="flex:1">${R(id).name}</span><span class="arr">›</span></li>`).join('')}</ul>`}
        <span class="chip link">${I.link}Связано с сервисной книжкой</span>
        <p class="muted small">Нажмите на деталь, чтобы открыть её историю.</p></section>
    </div></div>`;
  },
  choose(st){
    const rec=st.rec&&S.records.find(r=>r.id===st.rec);
    const date=rec?rec.date:TODAY;
    return `<div class="screen"><header class="appbar"><button class="icon-btn" data-a="back" aria-label="Назад">${I.back}</button></header>
      <div class="scroll choose">
        <h1 class="choose-h">Заказ-наряд от <span>${dots(date)}</span></h1>
        ${rec?`<p class="muted small">Для записи «${esc(rec.title)}»</p>`:''}
        <button class="drop" data-a="wo-start" ${st.part?`data-part="${st.part}"`:''} ${st.rec?`data-rec="${st.rec}"`:''}>${I.docplus}<span>Добавить фото или pdf для распознавания</span></button>
        <button class="btn btn-text manual-link" data-a="wo-manual" ${st.part?`data-part="${st.part}"`:''} ${st.rec?`data-rec="${st.rec}"`:''}>${I.pen}Заполнить вручную</button>
      </div></div>`;
  },
  scan(){
    const d=ui.draft;
    return `<div class="screen">${appbar('Заказ-наряд','')}<div class="scroll" style="justify-content:center;gap:22px">
      <div style="position:relative;padding:0 18px"><div style="position:relative;overflow:hidden;border-radius:6px">${paper(d,'—')}<div class="scanline"></div></div></div>
      <div class="center-block"><h2>Заказ-наряд добавлен</h2><p class="muted"><span class="spin"></span>Распознаём документ…</p></div>
      <button class="btn btn-text" data-a="show-result" style="align-self:center">Показать результат</button>
    </div></div>`;
  },
  result(){
    const d=ui.draft, rec=d.recordId&&S.records.find(r=>r.id===d.recordId);
    return `<div class="screen">${appbar('Проверьте запись','Результат распознавания')}<div class="scroll">
      <section class="card">
        <span class="eyebrow">Сервис</span><h2 style="font-size:20px">${esc(d.service)}</h2>
        <p class="muted tnum">${fmtDate(d.date)} · ${km(d.mileage)} км</p><p class="big-price">${money(d.price)}</p>
      </section>
      <section class="card"><h2 class="card-h">Нашли в заказ-наряде:</h2>
        <ul class="found">${d.parts.map(id=>`<li>${I.check}${R(id).name}</li>`).join('')}</ul></section>
      ${rec?`<p class="note">Документ подтвердит запись «${esc(rec.title)}» от ${fmtDateLow(rec.date)}. Новая запись не появится.</p>`:''}
    </div><div class="footer">
      <button class="btn btn-primary block" data-a="confirm">Подтвердить запись</button>
      <button class="btn btn-outline block" data-a="edit">Изменить данные</button></div></div>`;
  },
  edit(){
    const d=ui.draft;
    const checks=d.manual
      ?S.rules.map(r=>{const on=d.parts.includes(r.id);return `<div class="ci${on?' on':''}"><label><input type="checkbox" name="ep" value="${r.id}" ${on?'checked':''}>${r.name}</label>${on?itemPanel(r.id,d.items[r.id]):''}</div>`}).join('')
      :S.rules.map(r=>`<label><input type="checkbox" name="ep" value="${r.id}" ${d.parts.includes(r.id)?'checked':''}>${r.name}</label>`).join('');
    const rec=d.recordId&&S.records.find(r=>r.id===d.recordId);
    return `<div class="screen">${appbar(d.manual?'Заказ-наряд вручную':'Изменить данные',d.manual?'Данные из документа':'')}<div class="scroll">
      ${d.manual&&rec?`<p class="note">Заказ-наряд будет прикреплён к записи «${esc(rec.title)}» от ${fmtDateLow(rec.date)}.</p>`:''}
      <div class="field"><label for="e-date">Дата</label><div class="input"><input id="e-date" type="date" value="${d.date}"></div></div>
      <div class="field"><label for="e-km">Пробег</label><div class="input"><input id="e-km" inputmode="numeric" data-fmt value="${km(d.mileage)}"><span>км</span></div></div>
      <div class="field"><label for="e-svc">Сервис</label><div class="input"><input id="e-svc" value="${esc(d.service)}" placeholder="Название сервиса"></div></div>
      ${d.manual?'':`<div class="field"><label for="e-price">Стоимость</label><div class="input"><input id="e-price" inputmode="numeric" data-fmt value="${d.price?km(d.price):''}" placeholder="необязательно"><span>₽</span></div></div>`}
      <div class="field"><label>${d.manual?'Детали и работы':'Позиции'}</label>${d.manual?'<p class="muted small">Отметьте, что меняли, и заполните данные из заказ-наряда.</p>':''}<div class="checks">${checks}</div></div>
      <p class="err" id="e-err"></p>
    </div><div class="footer">${d.manual?`<div class="receipt-total"><span>ИТОГО:</span><span id="e-total">${km(itemsTotal(d))} ₽</span></div>`:''}<button class="btn btn-primary block" data-a="edit-save">${d.manual?'Сохранить заказ-наряд':'Сохранить'}</button></div></div>`;
  },
  dup(st){
    const rec=S.records.find(r=>r.id===st.rec), d=ui.draft;
    const shared=d.parts.filter(p=>rec.parts.includes(p)).map(p=>R(p).gen).join(' и ');
    return `<div class="screen">${appbar('Похожая запись','')}<div class="scroll" style="justify-content:center">
      <div class="center-block" style="gap:10px"><div class="list-btn" style="width:auto;padding:0"><span class="ic" style="width:56px;height:56px;border-radius:18px">${I.q}</span></div>
      <h2>В заказ-наряде нашли замену ${shared}.</h2><p class="muted">Это та же замена, которую вы уже отметили?</p></div>
      <article class="rec owner" style="margin:6px 0 0;cursor:default"><span class="rec-meta">${fmtDate(rec.date)} · ${km(rec.mileage)} км</span><h4>${esc(rec.title)}</h4>${srcChip(rec)}</article>
    </div><div class="footer">
      <button class="btn btn-primary block" data-a="dup-yes" data-rec="${rec.id}">Да, подтвердить запись</button>
      <button class="btn btn-outline block" data-a="dup-no">Нет, это отдельное обслуживание</button></div></div>`;
  },
  quick(st){
    const r=R(st.part);
    return `<div class="screen quick"><header class="appbar"><button class="icon-btn back-round" data-a="back" aria-label="Назад">${I.back}</button>
      <div class="appbar-t"><h1>Замена ${r.gen}</h1><p>Быстрая запись</p></div></header><div class="scroll">
      <div class="qf"><label for="q-date">Дата</label><div class="qin date"><span id="q-date-t">${fmtDateFull(TODAY)}</span><input id="q-date" type="date" value="${TODAY}" max="${TODAY}"></div></div>
      <div class="qf"><label for="q-km">Пробег</label><div class="qin"><input id="q-km" inputmode="numeric" data-fmt value="${km(S.v.mileage)}"><span>км</span></div></div>
      <p class="err" id="q-err"></p>
      <p class="qnote">${I.info}<span>Сервис, стоимость и документ не нужны. Заказ-наряд можно прикрепить к записи позже.</span></p>
      <button class="qdrop" data-a="quick-wo" data-part="${r.id}">${I.docplus}<span>Добавить фото или pdf<br>заказ-наряда</span></button>
    </div><div class="footer qfoot"><button class="qsave" data-a="quick-save" data-part="${r.id}">Сохранить</button></div></div>`;
  },
};

const TABS={
  resource(){
    const res=resource();
    const unk=nav.allUnknown?res.unknown:res.unknown.slice(0,3);
    const sec=(cls,t,list)=>`<h3 class="sec-h"><span class="dot ${cls}"></span>${t}<span class="count">${list.length}</span></h3>`;
    return `<div class="strip"><div><span class="eyebrow">Текущий пробег</span><div class="strip-v">${km(S.v.mileage)} км</div></div>
        <button class="btn btn-primary sm" data-a="mileage">Изменить</button></div>
      ${res.over.length?sec('over','Пора менять',res.over)+res.over.map(partCard).join(''):''}
      ${res.soon.length?sec('soon','Скоро менять',res.soon)+res.soon.map(partCard).join(''):''}
      ${res.ok.length?sec('ok','В порядке',res.ok)+res.ok.map(partCard).join(''):''}
      ${res.unknown.length?sec('unknown','Нужно уточнить историю',res.unknown)+unk.map(partCard).join('')
        +(res.unknown.length>3?`<button class="btn btn-text sm more" data-a="more-unknown">${nav.allUnknown?'Свернуть':`Показать все (${res.unknown.length})`}</button>`:''):''}`;
  },
  book(){
    const res=resource();
    const card=x=>partCard(x).replace(/^<article class="part /,'<article class="part rp ').replace('data-a="part" data-id','data-a="partpage" data-id');
    const n=k=>`${k} ${plural(k,'деталь','детали','деталей')}`;
    const sec=(st,title,sub,list)=>list.length?`<section class="pnl"><h3 class="pnl-h"><span class="dot ${st}"></span>${title}</h3><p class="pnl-s">${sub}</p>
      <div class="rc-row">${list.map(card).join('')}</div></section>`:'';
    return `<section class="pnl top">
        <div class="row-b"><div><div class="strip-v">${km(S.v.mileage)} км</div><span class="muted small">Пробег обновлён ${fmtDateLow(S.v.updated)}</span></div>
          <button class="btn btn-primary sm" data-a="mileage">Изменить</button></div>
      </section>
      ${res.over.length+res.soon.length?`<section class="pnl"><h3 class="pnl-h">Пора менять<span class="count">${res.over.length+res.soon.length}</span></h3>
        <div class="rc-row">${[...res.over,...res.soon].map(attnCard).join('')}</div></section>`:''}
      ${res.ok.length?`<section class="pnl"><h3 class="pnl-h">В порядке<span class="count">${res.ok.length}</span></h3>
        <div class="rc-row">${res.ok.map(okCard).join('')}</div></section>`:''}
      ${res.unknown.length?`<section class="pnl"><h3 class="pnl-h">Нужно уточнить историю<span class="count">${res.unknown.length}</span></h3>
        <div class="rc-row">${res.unknown.map(unkCard).join('')}</div></section>`:''}
      ${(()=>{const ex=S.rules.filter(r=>r.excluded);return ex.length?`<section class="pnl"><h3 class="pnl-h">Исключённые</h3><p class="pnl-s">${n(ex.length)} — не отслеживаются</p>
        <div class="ex-list">${ex.map(r=>`<button class="ex-chip" data-a="partpage" data-id="${r.id}">${r.name}</button>`).join('')}</div></section>`:''})()}`;
  },
  wos(){
    const list=[...S.wos].sort((a,b)=>b.date.localeCompare(a.date)||b.number-a.number);
    return `<button class="btn btn-primary block" data-a="wo-choose" style="margin-top:12px">${I.docplus}Добавить заказ-наряд</button>
      <p class="note">Здесь только документы. Замены, отмеченные без заказ-наряда, хранятся в сервисной книжке.</p>
      ${list.map(w=>{const rec=S.records.find(r=>r.id===w.recordId);return `<article class="wo-item" data-a="wo" data-id="${w.id}" tabindex="0">${thumb}<div>
        <h4>Заказ-наряд №${w.number}${w.manual?' · вручную':''}</h4>
        <span class="muted small tnum">${fmtDate(w.date)} · ${km(w.mileage)} км</span>
        <span class="small">${esc(w.service)}</span>
        <span class="muted small">${partsText(w.parts)}</span>
        ${w.price?`<span class="price">${money(w.price)}</span>`:''}
        <span class="chip link">${I.link}В книжке: ${rec?(rec.parts.length>1?`${rec.parts.length} ${plural(rec.parts.length,'деталь','детали','деталей')}`:esc(rec.title)):'запись'}</span></div></article>`}).join('')}`;
  },
  rules(){
    const act=S.rules.filter(r=>!r.excluded), exc=S.rules.filter(r=>r.excluded);
    return `${act.map(r=>`<article class="rule"><div><h4>${r.name}</h4>
        <span class="muted small">${SRC_LABEL[r.src]}${r.custom?' · <span class="badge-own">Ваш период</span>':''}</span>
        <span class="tnum">${intervalLabel(r)}</span></div>
        <div class="rule-acts"><button class="btn btn-text sm" data-a="rule" data-id="${r.id}">${r.km||r.mo?'Изменить период':'Указать период'}</button>
        <button class="btn btn-text sm muted-btn" data-a="exclude" data-id="${r.id}">Исключить</button></div></article>`).join('')}
      ${exc.length?`<h3 class="sec-h" style="margin-top:10px">Исключённые<span class="count">${exc.length}</span></h3>
        <p class="muted small" style="margin-top:-8px">Эти детали не отслеживаются: их нет в ресурсе, напоминаниях и полноте истории.</p>
        ${exc.map(r=>`<article class="rule excluded"><div><h4>${r.name}</h4><span class="muted small">${intervalLabel(r)}</span></div>
        <div class="rule-acts"><button class="btn btn-text sm" data-a="unexclude" data-id="${r.id}">Вернуть</button></div></article>`).join('')}`:''}`;
  },
};

/* ---------- overlays ---------- */
const OVERLAYS={
  mark(o){
    const r=R(o.part), a=ui.ovAnim?' anim':'';
    return `<div class="scrim" data-a="close"></div><div class="sheet${a}" role="dialog" aria-label="Отметить замену"><span class="grab"></span>
      <h2>Заменили ${lowFirst(r.name)}?</h2>
      <p class="muted">Заказ-наряд поможет сохранить:</p>
      <ul class="bullets"><li>сервис;</li><li>стоимость;</li><li>дату и пробег;</li><li>все детали из одного ТО.</li></ul>
      <button class="btn btn-primary block" data-a="wo-choose" data-part="${r.id}">${I.docplus}Добавить заказ-наряд</button>
      <div class="divider">Без документа</div>
      <button class="btn btn-outline block" data-a="manual" data-part="${r.id}">Отметить замену</button></div>`;
  },
  mileage(){
    return `<div class="scrim" data-a="close"></div><div class="sheet form${ui.ovAnim?' anim':''}" role="dialog" aria-label="Обновить пробег"><span class="grab"></span>
      <h2>Обновить пробег</h2>
      <p class="muted small">Сейчас в книжке ${km(S.v.mileage)} км</p>
      <div class="input"><input id="m-in" inputmode="numeric" data-fmt value="${km(S.v.mileage)}"><span>км</span></div>
      <p class="err" id="m-err"></p>
      <button class="btn btn-primary block" data-a="mileage-save" data-primary>Сохранить</button></div>`;
  },
  rule(o){
    const r=R(o.id);
    return `<div class="scrim" data-a="close"></div><div class="sheet form${ui.ovAnim?' anim':''}" role="dialog" aria-label="Изменить период"><span class="grab"></span>
      <h2>${r.name}</h2><p class="muted small">${SRC_LABEL[r.src]}: ${lowFirst(intervalLabel({km:r.base.km,mo:r.base.mo}))}</p>
      <div class="field"><label for="r-km">Пробег</label><div class="input"><input id="r-km" inputmode="numeric" data-fmt value="${r.km?km(r.km):''}" placeholder="не учитывать"><span>км</span></div></div>
      <div class="field"><label for="r-mo">Срок</label><div class="input"><input id="r-mo" inputmode="numeric" value="${r.mo||''}" placeholder="не учитывать"><span>мес.</span></div></div>
      <p class="muted small">Оставьте поле пустым, если ограничения нет. Сработает то, что наступит раньше.</p>
      <p class="err" id="r-err"></p>
      <button class="btn btn-primary block" data-a="rule-save" data-id="${r.id}" data-primary>Сохранить</button>
      ${r.custom?`<button class="btn btn-outline block" data-a="rule-reset" data-id="${r.id}">Вернуть регламент</button>`:''}</div>`;
  },
  add(){
    const li=(a,ic,t,s,extra='')=>`<button class="list-btn" data-a="${a}" ${extra}><span class="ic">${ic}</span><span>${t}<small>${s}</small></span></button>`;
    return `<div class="scrim" data-a="close"></div><div class="sheet${ui.ovAnim?' anim':''}" role="dialog" aria-label="Добавить обслуживание"><span class="grab"></span>
      <h2>Добавить обслуживание</h2>
      ${li('wo-choose',I.docplus,'Добавить заказ-наряд','Сервис, стоимость и все детали сразу')}
      ${li('pick-part',I.wrench,'Отметить замену','Без документа, дата и пробег')}
      ${li('mileage',I.gauge,'Обновить пробег',`Сейчас ${km(S.v.mileage)} км`)}</div>`;
  },
  compl(){
    const c=completeness();
    const row=(x,sub)=>`<button class="list-btn" data-a="part" data-id="${x.r.id}"><span style="flex:1">${x.r.name}<small>${sub}</small></span><span class="arr">›</span></button>`;
    return `<div class="scrim" data-a="close"></div><div class="sheet${ui.ovAnim?' anim':''}" role="dialog" aria-label="Полнота истории"><span class="grab"></span>
      <h2>Полнота истории ${c.pct}%</h2>
      <p class="muted">Замена известна для ${c.known} из ${c.total} деталей регламента, ${c.wo} из них подтверждены заказ-нарядом. Чем полнее история, тем точнее прогноз и тем больше доверия при продаже машины.</p>
      ${c.none.length?`<div class="sheet-sec"><h3 class="sec-h"><span class="dot unknown"></span>Вы ни разу не указывали замену<span class="count">${c.none.length}</span></h3>
        <div>${c.none.map(x=>canNew(x.r)?`<div class="cr">${row(x,intervalLabel(x.r))}<button class="btn btn-outline sm" data-a="factory" data-id="${x.r.id}">Ещё не менял</button></div>`:row(x,intervalLabel(x.r))).join('')}</div>
        ${c.none.some(x=>canNew(x.r))?`<p class="muted small">«Ещё не менял» есть у деталей, чей интервал больше пробега и возраста машины: скорее всего, стоит оригинальная деталь.</p>`:''}</div>`:''}
      ${c.owner.length?`<div class="sheet-sec"><h3 class="sec-h"><span class="dot owner-dot"></span>Отмечено без документа<span class="count">${c.owner.length}</span></h3>
        <p class="muted small">Можно подтвердить, если сохранился заказ-наряд.</p>
        <div>${c.owner.map(x=>`<button class="list-btn" data-a="wo-choose" data-rec="${x.l.id}"><span style="flex:1">${x.r.name}<small>${fmtDate(x.l.date)} · ${km(x.l.mileage)} км</small></span><span class="arr">›</span></button>`).join('')}</div></div>`:''}
      ${!c.none.length&&!c.owner.length?'<p class="note">История полная, все замены подтверждены заказ-нарядами.</p>':''}
    </div>`;
  },
  pick(){
    const list=S.rules.filter(r=>(r.km||r.mo)&&!r.excluded).map(r=>({r,l:lastFor(r.id)}))
      .sort((a,b)=>(b.l?1:0)-(a.l?1:0)||(b.l&&a.l?b.l.date.localeCompare(a.l.date):0));
    const sub=l=>!l?'Нет информации о замене':l.source==='wo'?`Заказ-наряд ${dots(l.date)}`:l.source==='factory'?`С завода ${pd(l.date).getUTCFullYear()}`:`Последняя замена ${dots(l.date)}`;
    return `<div class="scrim" data-a="close"></div><div class="sheet pick${ui.ovAnim?' anim':''}" role="dialog" aria-label="Отметить замену"><span class="grab"></span>
      <h2>Отметить замену</h2>
      <div class="pick-list">${list.map(({r,l})=>`<button class="pick-it" data-a="manual" data-part="${r.id}"><span class="pick-ic">${PI[PART_KIND[r.id]]||I.wrench}</span><span class="pick-t"><b>${r.name}</b><span>${sub(l)}</span></span></button>`).join('')}</div></div>`;
  },
  menu(){
    return `<div class="scrim" data-a="close" style="background:transparent"></div><div class="menu" role="menu"><button role="menuitem" data-a="reset-ask">Сбросить демо-данные</button></div>`;
  },
  reset(){
    return `<div class="scrim" data-a="close"></div><div class="dialog${ui.ovAnim?' anim':''}" role="dialog" aria-label="Сбросить демо-данные">
      <h2>Сбросить демо-данные?</h2><p class="muted">Отметки, заказ-наряды, пробег и ваши периоды вернутся к исходным.</p>
      <div class="dialog-actions"><button class="btn btn-text" data-a="close">Отмена</button><button class="btn btn-danger" data-a="reset-do">Сбросить</button></div></div>`;
  },
};

/* ---------- render ---------- */
const app=document.getElementById('app'), ov=document.getElementById('ov'), toastEl=document.getElementById('toast');
const cur=()=>nav.stack[nav.stack.length-1];
function render(){
  const sc=app.querySelector('.scroll'); if(sc&&ui.curKey) scrollMem[ui.curKey]=sc.scrollTop;
  const t=cur(); const key=t.s+(t.s==='tabs'?':'+nav.tab:'')+(t.id||'');
  app.innerHTML=SCREENS[t.s](t);
  if(ui.anim){app.firstElementChild.classList.add('enter');ui.anim=false}
  const nsc=app.querySelector('.scroll'); if(nsc) nsc.scrollTop=scrollMem[key]||0;
  ui.curKey=key;
  if(ui.focus){const el=app.querySelector(`.part[data-id="${ui.focus}"]`);ui.focus=null;
    if(el){const sc=app.querySelector('.scroll');sc.scrollTop+=el.getBoundingClientRect().top-sc.getBoundingClientRect().top-(sc.clientHeight-el.offsetHeight)/2;el.classList.add('flash')}}
  ov.innerHTML=ui.overlay?OVERLAYS[ui.overlay.t](ui.overlay):'';
  if(ui.ovAnim){const f=ov.querySelector('input');if(f){f.focus();f.select&&f.select()}ui.ovAnim=false}
}
function push(st){nav.stack.push(st);ui.anim=true}
function openOv(o){ui.overlay=o;ui.ovAnim=true}
let toastTimer;
function toast(msg,action){
  clearTimeout(toastTimer);
  toastEl.innerHTML=`<div class="toast" role="status"><span>${msg}</span>${action?(action.a?`<button data-a="${action.a}" data-id="${action.id}">${action.label}</button>`:`<button data-a="toast-go" data-tab="${action.tab}">${action.label}</button>`):''}</div>`;
  toastTimer=setTimeout(()=>toastEl.innerHTML='',4200);
}

/* ---------- store operations ---------- */
const nid=p=>p+(++S.seq);
function updateMileage(v){S.v.mileage=v;S.v.updated=TODAY}
function markReplacement(partId,date,mileage){
  delete S.flags[partId];
  const rec={id:nid('r'),n:S.seq,date,mileage,title:`Замена ${R(partId).gen}`,parts:[partId],source:'owner'};
  S.records.push(rec); if(mileage>S.v.mileage) updateMileage(mileage); return rec;
}
function createWorkOrder(d,recordId){
  const number=Math.max(0,...S.wos.map(w=>w.number))+1;
  const wo={id:nid('w'),manual:!!d.manual,number,date:d.date,mileage:d.mileage,service:d.service,parts:[...d.parts],price:d.price,items:d.items?JSON.parse(JSON.stringify(d.items)):null,recordId};
  S.wos.push(wo); return wo;
}
function attachWorkOrderToRecord(d,recId){
  const rec=S.records.find(r=>r.id===recId);
  const wo=createWorkOrder(d,recId);
  rec.parts=[...new Set([...rec.parts,...d.parts])];
  rec.source='wo'; rec.service=d.service; rec.price=d.price; rec.woId=wo.id;
  if(rec.parts.length>1&&/^Замена/.test(rec.title)) rec.title='Техобслуживание';
  return rec;
}
function createSeparateRecordFromWorkOrder(d){
  const title=d.parts.length>1?'Техобслуживание':`Замена ${R(d.parts[0]).gen}`;
  const rec={id:nid('r'),n:S.seq,date:d.date,mileage:d.mileage,title,parts:[...d.parts],source:'wo',service:d.service,price:d.price};
  S.records.push(rec);
  rec.woId=createWorkOrder(d,rec.id).id;
  if(d.mileage>S.v.mileage) updateMileage(d.mileage);
  return rec;
}
function newDraft({part,recordId}){
  if(recordId){const r=S.records.find(x=>x.id===recordId);return {recordId,date:r.date,mileage:r.mileage,service:SERVICE,parts:[...r.parts],price:priceOf(r.parts)}}
  const parts=(!part||BASE_WO_PARTS.includes(part))?[...BASE_WO_PARTS]:[part];
  return {date:TODAY,mileage:S.v.mileage,service:SERVICE,parts,price:priceOf(parts)};
}
const findDup=d=>S.records.find(r=>r.source==='owner'&&r.date===d.date&&Math.abs(r.mileage-d.mileage)<=1000&&r.parts.some(p=>d.parts.includes(p)));
function finishFlow(rec){
  nav.stack.length=ui.flowBase; ui.draft=null;
  toast(`Заказ-наряд №${woNum(rec)} добавлен в книжку`, cur().s==='record'?null:{label:'В книжку',tab:'book'});
}

/* ---------- actions ---------- */
const val=id=>document.getElementById(id)?.value??'';
const setErr=(id,m)=>{const e=document.getElementById(id);if(e)e.textContent=m};
const A={
  back(){if(nav.stack.length>1){if(cur().s==='scan')ui.scanId++;nav.stack.pop()}},
  menu(){openOv({t:'menu'})},
  noop(){return false},
  'reset-ask'(){openOv({t:'reset'})},
  'reset-do'(){S=initial();nav={stack:[{s:'home'}],tab:'book',allUnknown:false};ui.overlay=null;ui.draft=null;ui.scanId++;scrollMem={};toast('Демо-данные сброшены')},
  'open-tab'(d){if(d.tab==='resource'){push({s:'resource'});return}if(cur().s!=='tabs')push({s:'tabs'});nav.tab=d.tab},
  'res-open'(d){
    if(d.id&&!nav.allUnknown){const u=resource().unknown;if(u.findIndex(x=>x.r.id===d.id)>2)nav.allUnknown=true}
    push({s:'resource'}); ui.focus=d.id||null;
  },
  tab(d){nav.tab=d.tab},
  'toast-go'(d){nav.stack=d.tab==='resource'?[{s:'home'},{s:'resource'}]:[{s:'home'},{s:'tabs'}];if(d.tab!=='resource')nav.tab=d.tab;ui.overlay=null;ui.anim=true;toastEl.innerHTML=''},
  mileage(){openOv({t:'mileage'})},
  'mileage-save'(){
    const v=digits(val('m-in')); const maxRec=Math.max(...S.records.map(r=>r.mileage));
    if(!v){setErr('m-err','Введите пробег в километрах');return false}
    if(v<maxRec){setErr('m-err',`Пробег не может быть меньше, чем в последней записи: ${km(maxRec)} км`);return false}
    updateMileage(v);ui.overlay=null;toast('Пробег обновлён — рекомендации пересчитаны');
  },
  part(d){openOv({t:'mark',part:d.id})},
  'wo-choose'(d){ui.overlay=null;push({s:'choose',part:d.part,rec:d.rec,base:nav.stack.length})},
  'wo-start'(d){
    ui.overlay=null; ui.flowBase=cur().s==='choose'?cur().base:nav.stack.length;
    ui.draft=newDraft({part:d.part,recordId:d.rec});
    push({s:'scan'}); const id=++ui.scanId;
    setTimeout(()=>{if(ui.scanId===id&&cur().s==='scan'){nav.stack[nav.stack.length-1]={s:'result'};render()}},1900);
  },
  'wo-manual'(d){
    ui.overlay=null; ui.flowBase=cur().s==='choose'?cur().base:nav.stack.length;
    const rec=d.rec&&S.records.find(x=>x.id===d.rec);
    ui.draft=rec?{recordId:rec.id,date:rec.date,mileage:rec.mileage,service:'',parts:[...rec.parts],price:null,manual:true}
      :{date:TODAY,mileage:S.v.mileage,service:'',parts:d.part?[d.part]:[],price:null,manual:true};
    ui.draft.items=Object.fromEntries(ui.draft.parts.map(id=>[id,newItem(id)]));
    push({s:'edit'});
  },
  'show-result'(){ui.scanId++;nav.stack[nav.stack.length-1]={s:'result'}},
  confirm(){
    const d=ui.draft;
    if(d.recordId){finishFlow(attachWorkOrderToRecord(d,d.recordId));return}
    const dup=findDup(d);
    if(dup){push({s:'dup',rec:dup.id});return}
    finishFlow(createSeparateRecordFromWorkOrder(d));
  },
  'dup-yes'(d){finishFlow(attachWorkOrderToRecord(ui.draft,d.rec))},
  'dup-no'(){finishFlow(createSeparateRecordFromWorkOrder(ui.draft))},
  edit(){push({s:'edit'})},
  qty(d){const it=ui.draft.items[d.id];it.qty=Math.max(1,Math.min(99,it.qty+Number(d.d)));syncTotals(d.id);return false},
  'photo-del'(d){ui.draft.items[d.id].photo=null},
  'edit-save'(){
    if(ui.draft.manual){
      const d=ui.draft;
      if(!d.parts.length){setErr('e-err','Отметьте хотя бы одну деталь');return false}
      if(!d.mileage||!d.date){setErr('e-err','Укажите дату и пробег');return false}
      if(!d.service.trim()){setErr('e-err','Укажите сервис из заказ-наряда');return false}
      d.parts.forEach(id=>{if(!d.items[id].name.trim())d.items[id].name=R(id).name});
      d.items=Object.fromEntries(d.parts.map(id=>[id,{...d.items[id]}]));
      d.service=d.service.trim(); d.price=itemsTotal(d)||null;
      return A.confirm();
    }
    const parts=[...app.querySelectorAll('input[name=ep]:checked')].map(i=>i.value);
    const mileage=digits(val('e-km')), price=digits(val('e-price')), date=val('e-date'), service=val('e-svc').trim();
    if(!parts.length){setErr('e-err','Отметьте хотя бы одну позицию');return false}
    if(!mileage||!date){setErr('e-err','Укажите дату и пробег');return false}
    if(ui.draft.manual&&!service){setErr('e-err','Укажите сервис из заказ-наряда');return false}
    Object.assign(ui.draft,{parts,mileage,price:price||(ui.draft.manual?null:priceOf(parts)),date,service:service||SERVICE});
    if(ui.draft.manual) return A.confirm();
    nav.stack.pop();
  },
  'quick-wo'(d){
    const date=val('q-date')||TODAY, mileage=digits(val('q-km'))||S.v.mileage;
    if(date>TODAY){setErr('q-err','Дата не может быть позже сегодняшней');return false}
    A['wo-start']({part:d.part}); ui.flowBase=nav.stack.length-2;
    Object.assign(ui.draft,{date,mileage});
  },
  manual(d){ui.overlay=null;push({s:'quick',part:d.part})},
  'quick-save'(d){
    const date=val('q-date'), mileage=digits(val('q-km'));
    if(!date){setErr('q-err','Укажите дату');return false}
    if(date>TODAY){setErr('q-err','Дата не может быть позже сегодняшней');return false}
    if(!mileage){setErr('q-err','Укажите пробег');return false}
    markReplacement(d.part,date,mileage); nav.stack.pop();
    const st=compute(R(d.part));
    toast(`Замена отмечена · ${R(d.part).name}: ${st.status==='ok'?'в порядке':'скоро менять'}`,{label:'В книжку',tab:'book'});
  },
  record(d){push({s:'record',id:d.id})},
  partpage(d){push({s:'partpage',id:d.id})},
  wo(d){push({s:'wo',id:d.id})},
  'rules-open'(){push({s:'rules'})},
  'book-add'(){openOv({t:'add'})},
  'pick-part'(){openOv({t:'pick'})},
  rule(d){openOv({t:'rule',id:d.id})},
  'rule-save'(d){
    const k=digits(val('r-km'))||null, m=digits(val('r-mo'))||null;
    if(!k&&!m){setErr('r-err','Укажите пробег, срок или оба значения');return false}
    const r=R(d.id); r.km=k; r.mo=m; r.custom=!(k===r.base.km&&m===r.base.mo);
    ui.overlay=null; toast('Период сохранён — прогноз обновлён',{label:'Ресурс',tab:'resource'});
  },
  'rule-reset'(d){const r=R(d.id);r.km=r.base.km;r.mo=r.base.mo;r.custom=false;ui.overlay=null;toast('Вернули период по регламенту')},
  compl(){openOv({t:'compl'})},
  exclude(d){R(d.id).excluded=true; toast(`${R(d.id).name}: больше не отслеживаем`,{label:'Вернуть',a:'unexclude',id:d.id})},
  unexclude(d){R(d.id).excluded=false; toastEl.innerHTML=''; toast(`${R(d.id).name}: снова отслеживаем`)},
  factory(d){markFactory(d.id);const x=compute(R(d.id));
    if(ui.overlay&&ui.overlay.t==='compl'){} else ui.overlay=null;
    toast(`${R(d.id).name}: считаем ресурс с завода — ${x.status==='ok'?'в порядке':x.status==='soon'?'скоро менять':'пора менять'}`)},
  'more-unknown'(){nav.allUnknown=!nav.allUnknown},
  close(){ui.overlay=null},
};

document.getElementById('phone').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='LABEL'||el.tagName==='INPUT') return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.stopPropagation();
  if(fn(el.dataset,el)!==false) render();
});
document.getElementById('phone').addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.overlay){ui.overlay=null;render();return}
  if(e.key==='Enter'){
    const t=e.target;
    if(t.tagName==='INPUT'){const p=ov.querySelector('[data-primary]');if(p){e.preventDefault();p.click()}return}
    if(t.matches('[data-a][tabindex]')){e.preventDefault();t.click()}
  }
});
document.getElementById('phone').addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-fmt]')){const n=digits(t.value);t.value=isNaN(n)?'':km(n)}
  if(t.id==='q-date'&&t.value){const l=document.getElementById('q-date-t');if(l)l.textContent=fmtDateFull(t.value)}
  const d=ui.draft;
  if(d&&d.manual&&cur().s==='edit'){
    if(t.id==='e-date') d.date=t.value;
    if(t.id==='e-km') d.mileage=digits(t.value)||0;
    if(t.id==='e-svc') d.service=t.value;
    if(t.dataset.item){const it=d.items[t.dataset.item];
      if(t.dataset.f==='price') it.price=digits(t.value)||null; else it.name=t.value;
      syncTotals(t.dataset.item)}
  }
});
document.getElementById('phone').addEventListener('change',e=>{
  const d=ui.draft;
  if(e.target.name==='ep'&&d?.manual){
    const id=e.target.value;
    if(e.target.checked){if(!d.parts.includes(id))d.parts.push(id);if(!d.items[id])d.items[id]=newItem(id)}
    else d.parts=d.parts.filter(x=>x!==id);
    render(); return;
  }
  if(e.target.dataset.photo&&d?.manual){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const id=e.target.dataset.photo, rd=new FileReader();
    rd.onload=()=>{d.items[id].photo=rd.result;render()}; rd.readAsDataURL(f); return;
  }
  if(e.target.name==='ep'&&!ui.draft?.manual){
    const parts=[...app.querySelectorAll('input[name=ep]:checked')].map(i=>i.value);
    const p=document.getElementById('e-price'); if(p) p.value=parts.length?km(priceOf(parts)):'';
  }
});
(function(){const d=new Date();document.getElementById('clock').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`})();
/* swipe sheet down to close */
(function(){let y0=null,sh=null,dy=0;
  ov.addEventListener('touchstart',e=>{const t=e.target.closest('.sheet');if(!t||t.scrollTop>0||e.target.closest('input'))return;sh=t;y0=e.touches[0].clientY;dy=0},{passive:true});
  ov.addEventListener('touchmove',e=>{if(!sh)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`},{passive:true});
  ov.addEventListener('touchend',()=>{if(!sh)return;const t=sh;sh=null;t.style.transition='transform .2s';
    if(dy>90){t.style.transform='translateY(100%)';setTimeout(()=>{ui.overlay=null;render()},180)}else t.style.transform=''});
})();
render();
</script>
